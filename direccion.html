<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dirección - Gestión Guardias</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --accent: #2563eb;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px 14px 40px;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    .app-header {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      color: white;
      padding: 20px 22px;
      border-radius: var(--radius);
      box-shadow: 0 8px 20px -6px rgba(15, 23, 42, 0.35);
      margin-bottom: 14px;
    }
    .header-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 1.3rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .subtitle { margin: 5px 0 0; font-size: 0.88rem; color: #cbd5e1; }
    .nav-btns {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.12);
      padding: 4px;
      border-radius: 10px;
    }
    button {
      border: none;
      padding: 8px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.86rem;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .btn-nav { background: transparent; color: #ffffff; }
    .btn-nav:hover { background: rgba(255, 255, 255, 0.18); }
    .btn-hoy { background: #ffffff; color: #0f172a; }

    .control-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 0.92rem;
    }
    .pin-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f8fafc;
      padding: 6px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
    }
    .pin-box input {
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      width: 90px;
      font-size: 0.95rem;
      text-align: center;
      letter-spacing: 0.12em;
    }
    #estadoSync { font-weight: 700; font-size: 0.85rem; }

    /* Botones de ausencia amplios y táctiles */
    .btn-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-top: 8px;
      padding: 8px 10px;
      font-size: 0.82rem;
      border-radius: 8px;
      width: 100%;
      font-weight: 600;
    }
    .btn-presente {
      background: #f8fafc;
      color: #475569;
      border: 1px solid #cbd5e1;
    }
    .btn-presente:hover {
      background: #fee2e2;
      color: #991b1b;
      border-color: #fca5a5;
    }
    .btn-ausente {
      background: #dc2626;
      color: white;
      box-shadow: 0 2px 6px rgba(220, 38, 38, 0.25);
    }
    .btn-ausente:hover { background: #b91c1c; }

    .titular-tachado {
      text-decoration: line-through;
      color: #94a3b8;
      font-size: 0.8rem;
      display: block;
      margin-bottom: 2px;
    }
    .prof-nombre { font-weight: 600; color: var(--text); }
    .alerta { color: #dc2626; font-weight: 700; font-size: 0.86rem; }
    .sust { color: #0369a1; font-weight: 600; font-size: 0.86rem; }
    .badge-hoy {
      display: inline-block;
      background: var(--accent);
      color: white;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
      margin-left: 6px;
      vertical-align: middle;
    }

    /* Vista Escritorio */
    .desktop-table-wrap {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th {
      background: #f8fafc;
      color: #475569;
      font-weight: 700;
      text-align: left;
      padding: 12px 10px;
      border-bottom: 2px solid var(--border);
      font-size: 0.82rem;
      text-transform: uppercase;
    }
    td { padding: 12px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr.fila-hoy { background: #f8fbff; }
    tr.fila-hoy td:first-child { border-left: 4px solid var(--accent); }
    .festivo-cell { background: #fefce8; color: #854d0e; font-weight: 600; text-align: center; padding: 16px; }

    /* Vista Móvil (Tarjetas táctiles) */
    .mobile-cards { display: none; flex-direction: column; gap: 16px; }
    .day-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
    }
    .day-card.card-hoy { border: 2px solid var(--accent); }
    .day-card-header {
      background: #f8fafc;
      padding: 12px 15px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: 1rem;
    }
    .day-card.card-hoy .day-card-header { background: #eff6ff; }
    .zone-item {
      padding: 12px 15px;
      border-bottom: 1px solid #f1f5f9;
    }
    .zone-item:last-child { border-bottom: none; }
    .zone-item-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .zone-label { font-size: 0.84rem; color: var(--text-muted); font-weight: 600; flex-shrink: 0; }
    .zone-res { text-align: right; }

    .loading-box {
      background: var(--surface);
      padding: 32px 20px;
      text-align: center;
      border-radius: var(--radius);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    @media (max-width: 820px) {
      .desktop-table-wrap { display: none; }
      .mobile-cards { display: flex; }
      .header-top { flex-direction: column; align-items: stretch; }
      .nav-btns { justify-content: space-between; }
      .nav-btns button { flex: 1; text-align: center; }
      .control-bar { flex-direction: column; align-items: stretch; }
      .pin-box { justify-content: space-between; }
      .btn-toggle { padding: 10px 12px; font-size: 0.88rem; }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-top">
      <div>
        <h1>🔐 Panel Dirección · Guardias</h1>
        <p class="subtitle">Marca o reactiva ausencias con un toque; el cuadrante público se actualiza al instante</p>
      </div>
      <div class="nav-btns">
        <button class="btn-nav" onclick="cambiarSemana(-7)">◀ Anterior</button>
        <button class="btn-hoy" onclick="irHoy()">Hoy</button>
        <button class="btn-nav" onclick="cambiarSemana(7)">Siguiente ▶</button>
      </div>
    </div>
  </header>

  <div class="control-bar">
    <div id="bannerSemana">Cargando semana...</div>
    <div class="pin-box">
      <label for="pinInput"><strong>🔑 PIN Dirección:</strong></label>
      <input type="password" id="pinInput" inputmode="numeric" placeholder="••••" onchange="guardarPinLocal()">
      <span id="estadoSync"></span>
    </div>
  </div>

  <div id="tablaContenedor"><div class="loading-box">⏳ Cargando panel de gestión...</div></div>

<script>
  const URL_CSV_PROFESORES = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQV_ojIZRD3byi4tUtNrW5EQi_4b5Azyeu-3yPgLs3KQPONU5bvLLFWiOKzNm3eA5ArpsZX9uxK2gwX/pub?gid=1285716617&single=true&output=csv";
  const URL_CSV_FESTIVOS   = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQV_ojIZRD3byi4tUtNrW5EQi_4b5Azyeu-3yPgLs3KQPONU5bvLLFWiOKzNm3eA5ArpsZX9uxK2gwX/pub?gid=1070421064&single=true&output=csv";
  const URL_CSV_ZONAS      = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQV_ojIZRD3byi4tUtNrW5EQi_4b5Azyeu-3yPgLs3KQPONU5bvLLFWiOKzNm3eA5ArpsZX9uxK2gwX/pub?gid=385516057&single=true&output=csv";
  const URL_SCRIPT_API     = "https://script.google.com/macros/s/AKfycbwDLRVkR7tfhHpHxz4u85fmlpW3VpKXlQqW5-tdffeyTiZGty_LF7dEJw8T83Bx9GLC/exec";

  let fechaRef = new Date();
  let datos = { profes: [], festivos: [], zonas: [], ausencias: [] };
  const iconosZona = ["🌳", "☀️", "🏛️", "🚻", "📚"];

  document.getElementById('pinInput').value = localStorage.getItem('pin_guardias_ies') || '';
  function guardarPinLocal() {
    localStorage.setItem('pin_guardias_ies', document.getElementById('pinInput').value);
  }

  function parseCSV(texto) {
    return texto.trim().split(/\r?\n/).map(linea => {
      const res = [];
      let actual = '', enComillas = false;
      for (let c of linea) {
        if (c === '"') enComillas = !enComillas;
        else if (c === ',' && !enComillas) { res.push(actual.trim()); actual = ''; }
        else actual += c;
      }
      res.push(actual.trim());
      return res;
    });
  }

  function normalizarFecha(str) {
    if (!str) return "";
    str = str.trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
    const m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    return "";
  }

  async function cargarDatos() {
    const t = Date.now();
    try {
      const [rProf, rFest, rZon, rAus] = await Promise.all([
        fetch(URL_CSV_PROFESORES + "&t=" + t).then(r => r.text()),
        fetch(URL_CSV_FESTIVOS   + "&t=" + t).then(r => r.text()),
        fetch(URL_CSV_ZONAS      + "&t=" + t).then(r => r.text()),
        fetch(URL_SCRIPT_API     + "?t=" + t).then(r => r.json())
      ]);

      datos.profes    = parseCSV(rProf).slice(1);
      datos.festivos  = parseCSV(rFest).slice(1);
      const zRows     = parseCSV(rZon).slice(1).map(r => r[0]).filter(Boolean);
      datos.zonas     = [zRows[0]||"Zona 1", zRows[1]||"Zona 2", zRows[2]||"Zona 3", zRows[3]||"Zona 4", zRows[4]||"Biblioteca"];
      datos.ausencias = rAus.ausencias || [];

      renderizar();
    } catch (e) {
      document.getElementById('tablaContenedor').innerHTML = `<div class="loading-box"><span class="alerta">Error al conectar con Google Sheets.</span></div>`;
    }
  }

  function renderizar() {
    const hoyISO = (() => {
      const h = new Date();
      return `${h.getFullYear()}-${String(h.getMonth()+1).padStart(2,'0')}-${String(h.getDate()).padStart(2,'0')}`;
    })();

    const diaRef = fechaRef.getDay();
    const diffLunes = (diaRef === 0) ? -6 : (1 - diaRef);
    const lunes = new Date(fechaRef);
    lunes.setDate(fechaRef.getDate() + diffLunes);
    lunes.setHours(12, 0, 0, 0);

    const viernes = new Date(lunes);
    viernes.setDate(lunes.getDate() + 4);

    const fmtCorto = d => `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
    const fmtISO   = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

    let inicioCurso = new Date(lunes.getFullYear(), 8, 15, 12, 0, 0);
    if (lunes < inicioCurso) inicioCurso.setFullYear(lunes.getFullYear() - 1);
    const dIni = inicioCurso.getDay();
    inicioCurso.setDate(inicioCurso.getDate() + ((dIni === 0) ? -6 : (1 - dIni)));

    const semanaNum = Math.floor((lunes - inicioCurso) / (7 * 24 * 60 * 60 * 1000));
    const turnoCiclo = ((semanaNum % 4) + 4) % 4;

    document.getElementById('bannerSemana').innerHTML =
      `📅 <strong>Semana del ${fmtCorto(lunes)} al ${fmtCorto(viernes)}</strong> · Turno <strong>${turnoCiclo + 1} de 4</strong>`;

    const z = datos.zonas;
    const diasNombres = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];

    let htmlDesktop = `<div class="desktop-table-wrap"><table><thead><tr><th>Día</th>${z.map((n, i) => `<th>${iconosZona[i] || '📍'} ${n}</th>`).join('')}</tr></thead><tbody>`;
    let htmlMobile  = `<div class="mobile-cards">`;

    for (let d = 0; d < 5; d++) {
      const fechaDia = new Date(lunes);
      fechaDia.setDate(lunes.getDate() + d);
      const isoDia = fmtISO(fechaDia);
      const esHoy = (isoDia === hoyISO);
      const badgeHoy = esHoy ? `<span class="badge-hoy">HOY</span>` : "";
      const etiquetaDia = `${diasNombres[d]} ${String(fechaDia.getDate()).padStart(2,'0')}/${String(fechaDia.getMonth()+1).padStart(2,'0')}`;

      const festivo = datos.festivos.find(f => normalizarFecha(f[0]) === isoDia);
      if (festivo) {
        htmlDesktop += `<tr class="${esHoy ? 'fila-hoy' : ''}"><td><strong>${etiquetaDia}</strong>${badgeHoy}</td><td colspan="5" class="festivo-cell">🎉 ${festivo[1] || 'Festivo'}</td></tr>`;
        htmlMobile  += `<div class="day-card ${esHoy ? 'card-hoy' : ''}"><div class="day-card-header">${etiquetaDia}${badgeHoy}</div><div class="festivo-cell">🎉 ${festivo[1] || 'Festivo'}</div></div>`;
        continue;
      }

      const profesDia = datos.profes.map(fila => fila[d]).filter(Boolean);
      const grupoRot = profesDia.slice(0, 4);
      const titZ5 = profesDia[4] || "";

      let rotados = ["", "", "", ""];
      for (let i = 0; i < grupoRot.length; i++) rotados[(i + turnoCiclo) % 4] = grupoRot[i];

      const titulares = [rotados[0], rotados[1], rotados[2], rotados[3], titZ5];
      const ausentesHoy = datos.ausencias.filter(a => normalizarFecha(a.fecha) === isoDia).map(a => a.profesor);

      const okZ1 = titulares[0] && !ausentesHoy.includes(titulares[0]);
      const okZ2 = titulares[1] && !ausentesHoy.includes(titulares[1]);
      const okZ3 = titulares[2] && !ausentesHoy.includes(titulares[2]);
      const okZ4 = titulares[3] && !ausentesHoy.includes(titulares[3]);
      const okZ5 = titulares[4] && !ausentesHoy.includes(titulares[4]);

      let resZ1 = okZ1 ? titulares[0] : "⚠️ SIN CUBRIR";
      let resZ2 = okZ2 ? titulares[1] : "⚠️ SIN CUBRIR";
      let resZ3 = okZ3 ? titulares[2] : "⚠️ SIN CUBRIR";
      let resZ4 = okZ4 ? titulares[3] : "⚠️ SIN CUBRIR";
      let resZ5 = okZ5 ? titulares[4] : "🔒 CERRADA";

      if (!okZ1 && okZ2 && okZ3 && okZ4) {
        resZ1 = `${titulares[3]} (sustituye desde ${z[3]})`;
        resZ4 = `${titulares[2]} (comparte ${z[2]} y ${z[3]})`;
      } else if (okZ1 && !okZ2 && okZ3 && okZ4) {
        resZ2 = `${titulares[3]} (sustituye desde ${z[3]})`;
        resZ4 = `${titulares[2]} (comparte ${z[2]} y ${z[3]})`;
      } else if (okZ1 && okZ2 && !okZ3 && okZ4) {
        resZ3 = `${titulares[3]} (comparte ${z[2]} y ${z[3]})`;
        resZ4 = `${titulares[3]} (comparte ${z[2]} y ${z[3]})`;
      } else if (okZ1 && okZ2 && okZ3 && !okZ4) {
        resZ4 = `${titulares[2]} (comparte ${z[2]} y ${z[3]})`;
      } else {
        let comodines = [];
        if (okZ4) comodines.push({ nombre: titulares[3], origen: z[3] });
        if (okZ3) comodines.push({ nombre: titulares[2], origen: z[2] });

        if (!okZ1 && comodines.length > 0) {
          let c = comodines.shift();
          resZ1 = `${c.nombre} (sustituye desde ${c.origen})`;
          if (c.nombre === titulares[3]) resZ4 = `⚠️ SIN CUBRIR (reubicado a ${z[0]})`;
          if (c.nombre === titulares[2]) resZ3 = `⚠️ SIN CUBRIR (reubicado a ${z[0]})`;
        }
        if (!okZ2 && comodines.length > 0) {
          let c = comodines.shift();
          resZ2 = `${c.nombre} (sustituye desde ${c.origen})`;
          if (c.nombre === titulares[3]) resZ4 = `⚠️ SIN CUBRIR (reubicado a ${z[1]})`;
          if (c.nombre === titulares[2]) resZ3 = `⚠️ SIN CUBRIR (reubicado a ${z[1]})`;
        }
      }

      const resultados = [resZ1, resZ2, resZ3, resZ4, resZ5];

      htmlDesktop += `<tr class="${esHoy ? 'fila-hoy' : ''}"><td><strong>${etiquetaDia}</strong>${badgeHoy}</td>`;
      htmlMobile  += `<div class="day-card ${esHoy ? 'card-hoy' : ''}"><div class="day-card-header">${etiquetaDia}${badgeHoy}</div>`;

      for (let idx = 0; idx < 5; idx++) {
        const tit = titulares[idx];
        const resTxt = resultados[idx];
        const estaAusente = tit && ausentesHoy.includes(tit);

        let cls = "prof-nombre";
        if (resTxt.includes("SIN CUBRIR") || resTxt.includes("CERRADA")) cls = "alerta";
        else if (resTxt.includes("sustituye") || resTxt.includes("comparte")) cls = "sust";

        const tachadoHtml = estaAusente ? `<span class="titular-tachado">Titular: ${tit}</span>` : "";
        const textoHtml   = `<div class="${cls}">${resTxt}</div>`;
        let botonHtml     = "";

        if (tit) {
          const btnClass = estaAusente ? "btn-toggle btn-ausente" : "btn-toggle btn-presente";
          const btnLabel = estaAusente ? `❌ Ausente · Pulsar para reactivar` : `Marcar ausente`;
          botonHtml = `<button class="${btnClass}" onclick="toggleAusencia('${isoDia}', '${tit.replace(/'/g, "\\'")}')">${btnLabel}</button>`;
        }

        htmlDesktop += `<td>${tachadoHtml}${textoHtml}${botonHtml}</td>`;
        htmlMobile  += `<div class="zone-item">
          <div class="zone-item-top">
            <span class="zone-label">${iconosZona[idx] || '📍'} ${z[idx]}</span>
            <div class="zone-res">${tachadoHtml}${textoHtml}</div>
          </div>
          ${botonHtml}
        </div>`;
      }

      htmlDesktop += `</tr>`;
      htmlMobile  += `</div>`;
    }

    htmlDesktop += `</tbody></table></div>`;
    htmlMobile  += `</div>`;
    document.getElementById('tablaContenedor').innerHTML = htmlDesktop + htmlMobile;
  }

  async function toggleAusencia(fecha, profesor) {
    const pin = document.getElementById('pinInput').value.trim();
    const status = document.getElementById('estadoSync');
    if (!pin) {
      alert("Introduce tu PIN en la barra superior antes de marcar una ausencia.");
      document.getElementById('pinInput').focus();
      return;
    }

    status.style.color = "#2563eb";
    status.innerText = "⏳ Guardando...";

    try {
      const resp = await fetch(URL_SCRIPT_API, {
        method: "POST",
        body: JSON.stringify({ fecha, profesor, pin })
      });
      const res = await resp.json();
      if (res.ok) {
        status.style.color = "#16a34a";
        status.innerText = "✅ Listo";
        await cargarDatos();
        setTimeout(() => { status.innerText = ""; }, 2000);
      } else {
        status.style.color = "#dc2626";
        status.innerText = "❌ " + res.msg;
      }
    } catch (e) {
      status.style.color = "#dc2626";
      status.innerText = "❌ Error de red";
    }
  }

  function cambiarSemana(dias) { fechaRef.setDate(fechaRef.getDate() + dias); renderizar(); }
  function irHoy() { fechaRef = new Date(); renderizar(); }

  cargarDatos();
</script>
</body>
</html>
